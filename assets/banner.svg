<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Rifat Anwar, Data and ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="220" fill="url(#bg)"/>

  <!-- Two slow waves along the bottom edge -->
  <path fill="#ffffff" fill-opacity="0.07" d="M0 168 q125 -44 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V220 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path fill="#ffffff" fill-opacity="0.10" d="M0 186 q125 36 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V220 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="12s" repeatCount="indefinite"/>
  </path>

  <text x="500" y="100" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Rifat Anwar</text>
  <text x="500" y="140" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="20" fill="#cfe3ea">Data &amp; ML Engineer  |  Python  |  Backend Systems</text>
</svg>
